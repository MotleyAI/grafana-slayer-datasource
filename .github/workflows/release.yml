# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.
  # Manual dry-run knob: lets you exercise the build path without tagging.
  # When triggered this way the sign step is skipped (no policy_token below),
  # so no remote state in Grafana's signing registry is mutated and you don't
  # burn a version number on a failing build.
  workflow_dispatch:

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      # Required for build-plugin's attestation: 'true' below.
      # `id-token: write` lets the runner request a short-lived OIDC token
      # from GitHub which Sigstore uses to issue the keyless signature;
      # `attestations: write` lets the action upload the .intoto.jsonl
      # statement back to the GitHub attestations API.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # build-plugin@v1.0.2 defaults go-version to "1.21" and sets
      # GOTOOLCHAIN=local before invoking mage, so we MUST override here —
      # go.mod requires 1.25.7 (Grafana plugin SDK also pins to 1.25).
      # node-version: '22' silences the engine warning and matches ci.yml.
      #
      # policy_token is intentionally NOT passed until Grafana approves the
      # plugin for signing. For first-time submissions Grafana's signing API
      # returns `409 InvalidArgument` until a human reviewer unlocks the
      # plugin id — the unsigned zip uploaded by this action is what gets
      # submitted via the catalog form for that initial review. After
      # plugins@grafana.com confirms approval, restore:
      #   policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.0.2
        with:
          go-version: '1.25.7'
          node-version: '22'
          # Produce a Sigstore-signed GitHub attestation that links the
          # published zip to this workflow + repo + commit. Verifiable with
          # `gh attestation verify motley-slayer-datasource-<ver>.zip
          #    --repo MotleyAI/grafana-slayer-datasource`.
          attestation: 'true'
